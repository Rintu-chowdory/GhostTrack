name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # stop the build on real errors, ignore style noise
          flake8 GhostTR.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 GhostTR.py tests/ --count --max-line-length=200 --exit-zero --statistics

      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ghosttrack:ci .

      - name: Smoke test image (non-interactive menu loads and exits)
        run: |
          docker run --rm ghosttrack:ci python3 -c "import GhostTR" 
