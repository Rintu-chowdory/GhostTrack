[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttrack"
dynamic = ["version"]
description = "OSINT utility to look up IP addresses, phone numbers and usernames across social media"
requires-python = ">=3.9"
dependencies = ["requests", "phonenumbers"]

[project.urls]
Homepage = "https://github.com/Rintu-chowdory/GhostTrack"

[tool.setuptools]
py-modules = ["GhostTR"]

[tool.setuptools.dynamic]
version = {attr = "GhostTR.__version__"}
